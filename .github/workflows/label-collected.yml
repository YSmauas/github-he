name: Label collected-strings issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    if: startsWith(github.event.issue.title, '[collected]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            try { await github.rest.issues.getLabel({ owner, repo, name: 'collected' }); }
            catch (e) { await github.rest.issues.createLabel({ owner, repo, name: 'collected', color: '1d76db', description: 'מחרוזות שנאספו מהסקריפט' }); }
            await github.rest.issues.addLabels({ owner, repo, issue_number: context.issue.number, labels: ['collected'] });
